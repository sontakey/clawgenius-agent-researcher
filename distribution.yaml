name: clawgenius-researcher
version: 0.2.0
description: Source-heavy research and analysis agent
hermes_requires: '>=0.12.0'
author: ClawGenius
license: Proprietary
env_requires: []
distribution_owned:
- SOUL.md
- skills/
- cron/
- mcp.json
- distribution.yaml
recommended_config:
  agent:
    max_turns: 40
  display:
    show_cost: true
    show_token_analytics: true
  delegation:
    reasoning_effort: medium
    max_iterations: 30
    child_timeout_seconds: 600
